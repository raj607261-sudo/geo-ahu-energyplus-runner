name: Keep EnergyPlus awake for pitch day

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keep-energyplus-awake.yml"

permissions:
  contents: read

concurrency:
  group: pitch-day-energyplus-keepalive
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping KissanShroom EnergyPlus health
        shell: bash
        env:
          HEALTH_URL: https://kissanshroom.raj607261.chatgpt.site/api/energyplus/health
        run: |
          set -euo pipefail
          if [ "$(TZ=Asia/Kolkata date +%F)" != "2026-08-27" ]; then
            echo "Pitch-day keep-awake window has ended."
            exit 0
          fi
          response="$(curl --fail --silent --show-error --location             --max-time 120 --retry 3 --retry-delay 5 --retry-all-errors             "$HEALTH_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
