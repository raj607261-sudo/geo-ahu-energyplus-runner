services:
  - type: cron
    name: kissanshroom-invention-engine
    runtime: python
    plan: starter
    region: singapore
    branch: kissanshroom-invention-engine
    schedule: "0 */6 * * *"
    buildCommand: cd invention-engine && pip install -r requirements.txt
    startCommand: cd invention-engine && python -m engine.run
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kissanshroom-rnd-production
          property: connectionString
databases:
  - name: kissanshroom-rnd-production
    databaseName: kissanshroom_rnd
    plan: basic-256mb
    region: singapore
